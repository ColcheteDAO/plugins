name: Build and Update Plugins

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Plugin to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - DuneFall
          - TikTokRetentionPlugin
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-plugins.yml'
  repository_dispatch:
    types:
      - build-plugins
      - build-dunefall
      - build-tiktokretention

permissions:
  contents: write

jobs:
  build-and-sync:
    name: Build & Sync Plugins
    runs-on: ubuntu-latest
    environment: main

    steps:
      - name: Checkout plugins repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Git Author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # --- Build DuneFall ---
      - name: Checkout DuneFall
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'DuneFall' || github.event.inputs.target == '' || github.event.action == 'build-plugins' || github.event.action == 'build-dunefall' }}
        uses: actions/checkout@v6
        with:
          repository: ColcheteDAO/DuneFall
          path: _build/DuneFall
          token: ${{ secrets.GH_PAT }}

      - name: Build DuneFall
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'DuneFall' || github.event.inputs.target == '' || github.event.action == 'build-plugins' || github.event.action == 'build-dunefall' }}
        run: |
          echo "Compiling DuneFall with Maven..."
          mvn -B clean package --file _build/DuneFall/pom.xml --no-transfer-progress

          JAR_FILE=$(ls _build/DuneFall/target/*.jar 2>/dev/null | grep -v 'original-' | head -n 1 || true)
          if [ -z "$JAR_FILE" ]; then
            echo "::error::No JAR file generated in _build/DuneFall/target/"
            exit 1
          fi

          echo "Found built JAR: $JAR_FILE"
          mkdir -p DuneFall
          rm -f DuneFall/*.jar
          cp "$JAR_FILE" DuneFall/
          if [ -f _build/DuneFall/SPEC.md ]; then
            echo "Copying SPEC.md for DuneFall..."
            cp _build/DuneFall/SPEC.md DuneFall/
          fi
          echo "DuneFall updated successfully:"
          ls -lh DuneFall/

      # --- Build TikTokRetentionPlugin ---
      - name: Checkout TikTokRetentionPlugin
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'TikTokRetentionPlugin' || github.event.inputs.target == '' || github.event.action == 'build-plugins' || github.event.action == 'build-tiktokretention' }}
        uses: actions/checkout@v6
        with:
          repository: ColcheteDAO/TikTokRetentionPlugin
          path: _build/TikTokRetentionPlugin
          token: ${{ secrets.GH_PAT }}

      - name: Build TikTokRetentionPlugin
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'TikTokRetentionPlugin' || github.event.inputs.target == '' || github.event.action == 'build-plugins' || github.event.action == 'build-tiktokretention' }}
        run: |
          echo "Compiling TikTokRetentionPlugin with Maven..."
          mvn -B clean package --file _build/TikTokRetentionPlugin/pom.xml --no-transfer-progress

          JAR_FILE=$(ls _build/TikTokRetentionPlugin/target/*.jar 2>/dev/null | grep -v 'original-' | head -n 1 || true)
          if [ -z "$JAR_FILE" ]; then
            echo "::error::No JAR file generated in _build/TikTokRetentionPlugin/target/"
            exit 1
          fi

          echo "Found built JAR: $JAR_FILE"
          mkdir -p TikTokRetentionPlugin
          rm -f TikTokRetentionPlugin/*.jar
          cp "$JAR_FILE" TikTokRetentionPlugin/
          if [ -f _build/TikTokRetentionPlugin/SPEC.md ]; then
            echo "Copying SPEC.md for TikTokRetentionPlugin..."
            cp _build/TikTokRetentionPlugin/SPEC.md TikTokRetentionPlugin/
          fi
          echo "TikTokRetentionPlugin updated successfully:"
          ls -lh TikTokRetentionPlugin/

      - name: Cleanup build workspace
        if: always()
        run: rm -rf _build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-plugins
          path: |
            DuneFall/
            TikTokRetentionPlugin/
          retention-days: 30

      - name: Commit and push updated plugins
        run: |
          git add DuneFall/ TikTokRetentionPlugin/
          if git diff --staged --quiet; then
            echo "No changes in built plugins detected."
          else
            git commit -m "chore(ci): update compiled plugin jars and specs [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
